name: Rust and PHP checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.5 with headers
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: php-config, phpize
      - name: Linux clang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
          echo "PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "PHP_CONFIG=$(command -v php-config)" >> "$GITHUB_ENV"
      - name: macOS clang
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          llvm_prefix="$(brew --prefix llvm)"
          echo "PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "PHP_CONFIG=$(command -v php-config)" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$llvm_prefix/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-resource-dir=$($llvm_prefix/bin/clang -print-resource-dir) -isysroot=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Stable Rust
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Release gate
        run: ./scripts/check
